name: Android CI

on:
  push:
    branches:
      - master
      - feat/assignment-completion
      - v1.0_dev
  pull_request:
    branches:
      - master
      - feat/assignment-completion

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify and conditionally build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for local ILT3 database
        id: ilt3-database
        shell: bash
        run: |
          if [ -f assets/database/ilt3.sqlite ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "ILT3 database found; database-backed tests and Android build are enabled."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ILT3 database unavailable::Database-backed tests and Android APK build are skipped because the local-use database is not included in this checkout."
            {
              echo "### Android APK build skipped"
              echo "The local-use ILT3 database is not present in this checkout. Database-backed tests are skipped; tests, type checking, and lint still run."
              echo "To validate the complete APK build, run it in an authorized environment that has the database locally."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Unit tests
        run: npm test -- --runInBand --silent

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Export Android JavaScript bundle
        if: steps.ilt3-database.outputs.available == 'true'
        run: npx expo export --platform android

      - name: Generate native Android project
        if: steps.ilt3-database.outputs.available == 'true'
        run: npx expo prebuild --platform android --no-install

      - name: Set up JDK 17
        if: steps.ilt3-database.outputs.available == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APK
        if: steps.ilt3-database.outputs.available == 'true'
        run: bash android/gradlew --no-daemon -p android -PreactNativeArchitectures=arm64-v8a assembleRelease

      - name: Upload APK artifact
        if: steps.ilt3-database.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meno-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
